name: Release NexusDeck

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-linux:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Install Arch Linux build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            curl \
            wget \
            file \
            openssl \
            appmenu-gtk-module \
            libappindicator-gtk3 \
            librsvg \
            webkit2gtk-4.1 \
            gtk3 \
            libsoup3 \
            rustup \
            nodejs \
            npm \
            patchelf \
            squashfs-tools \
            xdg-utils

      - name: Install Rust stable
        run: rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Sign Tauri App (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          includeRelease: false
          args: --bundles appimage

      - name: Upload Linux Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          name: "NexusDeck ${{ github.ref_name }}"
          body: "See the assets to download and install this version."
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  publish-windows:
    needs: publish-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Sign Tauri App (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeRelease: false

      - name: Generate latest.json for Tauri Updater
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          LINUX_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/NexusDeck_${VERSION}_amd64.AppImage"
          WIN_EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          WIN_NAME=$(basename "$WIN_EXE")
          WIN_SIG=$(cat "${WIN_EXE}.sig")
          WIN_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${WIN_NAME}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Descarcă semnătura Linux din release-ul creat de job-ul anterior
          curl -sL "https://github.com/${{ github.repository }}/releases/download/${TAG}/NexusDeck_${VERSION}_amd64.AppImage.sig" -o linux.sig
          LINUX_SIG=$(cat linux.sig)

          cat <<EOF > latest.json
          {
            "version": "${VERSION}",
            "notes": "See the assets to download and install this version.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${LINUX_URL}"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${WIN_URL}"
              }
            }
          }
          EOF

      - name: Upload Windows Assets & latest.json to Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            latest.json
